<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Imperial Gradient -->
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Metallic Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#coverBg)" />

  <!-- Center Ambient Glow -->
  <circle cx="600" cy="315" r="450" fill="url(#centerGlow)" />

  <!-- Geometric Royal Pattern Lines (Mughal Arch outlines) -->
  <g stroke="url(#gold)" stroke-width="1.5" opacity="0.2" fill="none">
    <circle cx="600" cy="315" r="320" stroke-dasharray="6 6" />
    <circle cx="600" cy="315" r="280" />
    <circle cx="600" cy="315" r="240" stroke-dasharray="4 4" />
    <path d="M 100 100 L 200 100 L 100 200 Z" />
    <path d="M 1100 100 L 1000 100 L 1100 200 Z" />
    <path d="M 100 530 L 200 530 L 100 430 Z" />
    <path d="M 1100 530 L 1000 530 L 1100 430 Z" />
  </g>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="1150" height="580" rx="20" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6" />
  <rect x="35" y="35" width="1130" height="560" rx="16" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Center Branding -->
  <g filter="url(#shadow)" text-anchor="middle">
    
    <!-- Imperial Crown Icon -->
    <g transform="translate(600, 160) scale(1.4)" fill="url(#gold)">
      <!-- Crown Base -->
      <path d="M -50 20 L 50 20 L 40 26 L -40 26 Z" />
      <rect x="-52" y="25" width="104" height="4" rx="2" />
      <!-- Crown Spikes -->
      <polygon points="0,-18 12,20 -12,20" />
      <polygon points="-30,-8 -18,20 -38,20" />
      <polygon points="30,-8 18,20 38,20" />
      <polygon points="-48,2 -38,20 -54,20" />
      <polygon points="48,2 38,20 54,20" />
      <!-- Crown Jewels -->
      <circle cx="0" cy="-21" r="4.5" />
      <circle cx="-30" cy="-11" r="3.5" />
      <circle cx="30" cy="-11" r="3.5" />
      <circle cx="-48" cy="-1" r="3" />
      <circle cx="48" cy="-1" r="3" />
    </g>

    <!-- Main Title: ROYAL RAJPUT -->
    <text x="600" y="295" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="12" 
          fill="url(#gold)">
      ROYAL RAJPUT
    </text>

    <!-- Tagline: IMPERIAL PAKISTANI FINE DINING & CHARCOAL BBQ -->
    <text x="600" y="350" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="800" 
          letter-spacing="7" 
          fill="#fef3c7"
          opacity="0.95">
      IMPERIAL PAKISTANI FINE DINING &amp; CHARCOAL BBQ
    </text>

    <!-- Divider Line with Diamond -->
    <line x1="380" y1="380" x2="820" y2="380" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <polygon points="600,375 606,380 600,385 594,380" fill="url(#gold)" />

    <!-- Feature Pillars (Mutton Biryani • Desi Ghee Karahi • Shinwari Lamb Chops) -->
    <text x="600" y="420" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#cbd5e1"
          opacity="0.85">
      Mutton Dum Biryani • Desi Ghee Karahi • Live Charcoal Sigri BBQ
    </text>

    <!-- Branch Locations & Website CTA -->
    <g transform="translate(600, 480)">
      <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#131d33" stroke="url(#gold)" stroke-width="1.5" />
      <text x="0" y="5" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="700" 
            letter-spacing="2" 
            fill="url(#gold)">
        ISLAMABAD • LAHORE • KARACHI
      </text>
    </g>

    <!-- Official Contact Subtext -->
    <text x="600" y="540" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="500" 
          letter-spacing="1.5" 
          fill="#94a3b8">
      Official Management: asadgohar21@gmail.com
    </text>
  </g>
</svg>
