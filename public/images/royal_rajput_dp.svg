<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Crown Jewel Red -->
    <radialGradient id="rubyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Ambient Golden Center Glow -->
  <circle cx="540" cy="520" r="460" fill="url(#glowGrad)" />

  <!-- Outer Ornate Circular Border -->
  <circle cx="540" cy="540" r="500" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
  <circle cx="540" cy="540" r="485" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="540" cy="540" r="468" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.7" />
  <circle cx="540" cy="540" r="452" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Outer Ring Stars / Pearls (48 decorative beads around border) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <circle cx="540" cy="57" r="5" />
    <circle cx="540" cy="1023" r="5" />
    <circle cx="57" cy="540" r="5" />
    <circle cx="1023" cy="540" r="5" />
    <circle cx="198" cy="198" r="4.5" />
    <circle cx="882" cy="198" r="4.5" />
    <circle cx="198" cy="882" r="4.5" />
    <circle cx="882" cy="882" r="4.5" />
    <circle cx="360" cy="80" r="4" />
    <circle cx="720" cy="80" r="4" />
    <circle cx="360" cy="1000" r="4" />
    <circle cx="720" cy="1000" r="4" />
    <circle cx="80" cy="360" r="4" />
    <circle cx="80" cy="720" r="4" />
    <circle cx="1000" cy="360" r="4" />
    <circle cx="1000" cy="720" r="4" />
  </g>

  <!-- Laurel Wreath Crest -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.65">
    <!-- Left Wreath Branch -->
    <path d="M 230 540 C 230 360, 340 250, 430 210" />
    <path d="M 230 540 C 230 720, 340 830, 430 870" />
    <!-- Right Wreath Branch -->
    <path d="M 850 540 C 850 360, 740 250, 650 210" />
    <path d="M 850 540 C 850 720, 740 830, 650 870" />
  </g>

  <!-- Wreath Leaf Sprigs -->
  <g fill="url(#goldGrad)" opacity="0.75">
    <!-- Left Leaves -->
    <ellipse cx="235" cy="460" rx="14" ry="7" transform="rotate(-30 235 460)" />
    <ellipse cx="255" cy="390" rx="14" ry="7" transform="rotate(-45 255 390)" />
    <ellipse cx="290" cy="325" rx="14" ry="7" transform="rotate(-55 290 325)" />
    <ellipse cx="340" cy="270" rx="14" ry="7" transform="rotate(-65 340 270)" />
    <ellipse cx="400" cy="230" rx="14" ry="7" transform="rotate(-75 400 230)" />
    <!-- Bottom Left Leaves -->
    <ellipse cx="235" cy="620" rx="14" ry="7" transform="rotate(30 235 620)" />
    <ellipse cx="255" cy="690" rx="14" ry="7" transform="rotate(45 255 690)" />
    <ellipse cx="290" cy="755" rx="14" ry="7" transform="rotate(55 290 755)" />
    <ellipse cx="340" cy="810" rx="14" ry="7" transform="rotate(65 340 810)" />
    <ellipse cx="400" cy="850" rx="14" ry="7" transform="rotate(75 400 850)" />
    <!-- Right Leaves -->
    <ellipse cx="845" cy="460" rx="14" ry="7" transform="rotate(30 845 460)" />
    <ellipse cx="825" cy="390" rx="14" ry="7" transform="rotate(45 825 390)" />
    <ellipse cx="790" cy="325" rx="14" ry="7" transform="rotate(55 790 325)" />
    <ellipse cx="740" cy="270" rx="14" ry="7" transform="rotate(65 740 270)" />
    <ellipse cx="680" cy="230" rx="14" ry="7" transform="rotate(75 680 230)" />
    <!-- Bottom Right Leaves -->
    <ellipse cx="845" cy="620" rx="14" ry="7" transform="rotate(-30 845 620)" />
    <ellipse cx="825" cy="690" rx="14" ry="7" transform="rotate(-45 825 690)" />
    <ellipse cx="790" cy="755" rx="14" ry="7" transform="rotate(-55 790 755)" />
    <ellipse cx="740" cy="810" rx="14" ry="7" transform="rotate(-65 740 810)" />
    <ellipse cx="680" cy="850" rx="14" ry="7" transform="rotate(-75 680 850)" />
  </g>

  <!-- CENTER EMBLEM: CROWN & CROSSED SCIMITARS -->
  <g filter="url(#royalShadow)">
    
    <!-- Crossed Rajput Scimitars / Swords Behind Crown -->
    <!-- Left to Right Sword -->
    <path d="M 330 520 C 440 450, 600 370, 750 310 Q 770 300, 780 320 C 760 345, 620 440, 480 500 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="320" cy="525" r="14" fill="url(#goldGrad)" />
    <rect x="330" y="500" width="12" height="48" rx="4" fill="url(#goldGrad)" transform="rotate(30 330 500)" />
    
    <!-- Right to Left Sword -->
    <path d="M 750 520 C 640 450, 480 370, 330 310 Q 310 300, 300 320 C 320 345, 460 440, 600 500 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="760" cy="525" r="14" fill="url(#goldGrad)" />
    <rect x="738" y="500" width="12" height="48" rx="4" fill="url(#goldGrad)" transform="rotate(-30 738 500)" />

    <!-- Imperial Crown -->
    <!-- Crown Base Band -->
    <path d="M 380 380 L 700 380 L 685 410 L 395 410 Z" fill="url(#goldGrad)" />
    <rect x="375" y="405" width="330" height="12" rx="4" fill="url(#goldGrad)" />

    <!-- Crown Jewels on Base Band -->
    <circle cx="430" cy="395" r="7" fill="url(#rubyGrad)" />
    <circle cx="485" cy="395" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="540" cy="395" r="10" fill="url(#rubyGrad)" />
    <circle cx="595" cy="395" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="650" cy="395" r="7" fill="url(#rubyGrad)" />

    <!-- Crown Peaks (5 Royal Spikes) -->
    <!-- Center Peak (Tallest) -->
    <path d="M 540 220 L 580 380 L 500 380 Z" fill="url(#goldGrad)" />
    <circle cx="540" cy="210" r="18" fill="url(#goldGrad)" />
    <circle cx="540" cy="210" r="10" fill="url(#rubyGrad)" />
    <path d="M 540 180 L 540 240 M 515 200 L 565 200" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Mid Left Peak -->
    <path d="M 450 260 L 490 380 L 420 380 Z" fill="url(#goldGrad)" />
    <circle cx="450" cy="250" r="13" fill="url(#goldGrad)" />
    <circle cx="450" cy="250" r="7" fill="#ffffff" opacity="0.9" />

    <!-- Mid Right Peak -->
    <path d="M 630 260 L 660 380 L 590 380 Z" fill="url(#goldGrad)" />
    <circle cx="630" cy="250" r="13" fill="url(#goldGrad)" />
    <circle cx="630" cy="250" r="7" fill="#ffffff" opacity="0.9" />

    <!-- Outer Left Peak -->
    <path d="M 370 300 L 420 380 L 360 380 Z" fill="url(#goldGrad)" />
    <circle cx="370" cy="295" r="11" fill="url(#goldGrad)" />
    <circle cx="370" cy="295" r="6" fill="url(#rubyGrad)" />

    <!-- Outer Right Peak -->
    <path d="M 710 300 L 720 380 L 660 380 Z" fill="url(#goldGrad)" />
    <circle cx="710" cy="295" r="11" fill="url(#goldGrad)" />
    <circle cx="710" cy="295" r="6" fill="url(#rubyGrad)" />
  </g>

  <!-- Ornate Decorative Divider Under Crown -->
  <g fill="url(#goldGrad)" filter="url(#royalShadow)">
    <circle cx="540" cy="460" r="8" />
    <path d="M 380 460 Q 460 455, 520 460 L 520 463 Q 460 458, 380 460 Z" />
    <path d="M 700 460 Q 620 455, 560 460 L 560 463 Q 620 458, 700 460 Z" />
    <polygon points="370,460 385,455 385,465" />
    <polygon points="710,460 695,455 695,465" />
  </g>

  <!-- BRAND NAME: ROYAL RAJPUT (High-Impact Luxury Typography) -->
  <g filter="url(#royalShadow)" text-anchor="middle">
    <!-- Word "ROYAL" -->
    <text x="540" y="585" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="86" 
          font-weight="900" 
          letter-spacing="14" 
          fill="url(#goldGrad)">
      ROYAL
    </text>

    <!-- Word "RAJPUT" -->
    <text x="540" y="695" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="104" 
          font-weight="900" 
          letter-spacing="16" 
          fill="url(#goldGrad)">
      RAJPUT
    </text>

    <!-- Subtle Golden Accent Line -->
    <line x1="320" y1="730" x2="760" y2="730" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="540,724 547,730 540,736 533,730" fill="url(#goldGrad)" />

    <!-- Subtitle: IMPERIAL FINE DINING -->
    <text x="540" y="775" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="10" 
          fill="#fef3c7"
          opacity="0.95">
      IMPERIAL FINE DINING
    </text>

    <!-- Subtext: PAKISTAN -->
    <text x="540" y="815" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="8" 
          fill="url(#goldGrad)"
          opacity="0.85">
      ESTD. 2024 • PAKISTAN
    </text>
  </g>

  <!-- Bottom Crest Motif -->
  <g fill="url(#goldGrad)" opacity="0.7" transform="translate(540, 855)">
    <circle cx="0" cy="0" r="4" />
    <circle cx="-25" cy="0" r="3" />
    <circle cx="25" cy="0" r="3" />
    <circle cx="-50" cy="0" r="2" />
    <circle cx="50" cy="0" r="2" />
    <path d="M -70 0 Q -35 -6, 0 0 Q 35 -6, 70 0" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" />
  </g>

</svg>
